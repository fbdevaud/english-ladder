<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tense Sprint: A2 Exam v5</title>
<style>
:root{--navy:#12213a;--blue:#2563eb;--pale:#eef5ff;--ink:#182033;--muted:#667085;--green:#087f5b;--red:#c92a2a;--amber:#c77d00;--line:#d9e2ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#edf5ff,#f7f9fc 55%,#e9f7f2);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}.app{max-width:640px;margin:auto;padding:18px 16px 32px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-weight:850;font-size:1.18rem;color:var(--navy)}.brand span{color:var(--blue)}.pill{font-size:.78rem;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.progress{height:8px;background:#dce6f3;border-radius:20px;overflow:hidden;margin-bottom:18px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:.35s}.card{background:#fff;border:1px solid #e5ebf3;border-radius:22px;padding:24px;box-shadow:0 12px 32px #1c315010}.tag{font-size:.78rem;color:var(--blue);font-weight:800;letter-spacing:.04em;text-transform:uppercase}.situation{font-size:1.13rem;line-height:1.5;margin:16px 0 9px}.hint{display:inline-block;color:#725500;background:#fff6d8;border-radius:9px;padding:7px 10px;font-size:.88rem}.task{font-weight:750;line-height:1.45;margin:19px 0 12px}input,textarea{width:100%;border:2px solid #cdd9e8;border-radius:13px;font:inherit;padding:14px;outline:none;transition:.2s;background:#fff}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2563eb1a}textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}.primary{background:var(--blue);color:#fff;flex:1}.secondary{background:#eef3fa;color:#3d4b62}.feedback{margin-top:16px;padding:15px;border-radius:13px;line-height:1.45}.correct{background:#e9f8f0;color:#075e43}.wrong{background:#fff0f0;color:#8e2020}.feedback b{display:block;margin-bottom:5px}.hide{display:none}.menu{display:grid;gap:12px}.hero{margin:4px 0 20px}.hero h1{font-size:2rem;line-height:1.08;margin:8px 0}.hero p{color:var(--muted);line-height:1.45}.mode{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff;text-align:left;cursor:pointer}.mode strong{display:block;font-size:1rem;margin-bottom:4px}.mode small{color:var(--muted);line-height:1.35}.stats{display:flex;gap:9px;margin:18px 0}.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.stat b{display:block;color:var(--blue);font-size:1.2rem}.stat small{color:var(--muted)}.words{font-size:.85rem;color:var(--muted);text-align:right;margin-top:5px}.checklist{background:var(--pale);padding:14px;border-radius:13px;line-height:1.6;font-size:.92rem}.tiny{font-size:.8rem;color:var(--muted);margin-top:18px;text-align:center}.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--navy)}
</style></head><body><main class="app"><div class="top"><div class="brand">Tense <span>Sprint</span></div><div class="pill" id="topInfo">A2 Exam Prep</div></div><div class="progress"><i id="bar"></i></div><section id="screen"></section></main>
<script>
const base=[
{type:'build',cat:'Present simple · negative',s:'Talk about Leo’s usual breakfast.',h:'every morning',t:'Write a negative sentence: Leo / drink coffee.',a:["leo doesn't drink coffee","leo does not drink coffee"],r:"Use <b>doesn't + base verb</b>. After <i>doesn't</i>, write <i>drink</i>, not <i>drinks</i>."},
{type:'build',cat:'Present simple · question',s:'Ask about Ana’s routine.',h:'on Mondays',t:'Write a question: Ana / work from home?',a:['does ana work from home?'],r:"Use <b>Does + subject + base verb?</b> for <i>she/he/it</i>."},
{type:'build',cat:'Present continuous',s:'Describe what Tom is doing now.',h:'right now',t:'Write a sentence: Tom / study / for his test / right now.',a:['tom is studying for his test right now.'],r:"Use <b>is + verb-ing</b> for an action happening now."},
{type:'fix',cat:'Past simple · negative',s:'Correct the sentence.',h:'yesterday',t:'She didn’t went to work.',a:["she didn't go to work.","she did not go to work."],r:"After <b>didn't</b>, use the <b>base verb</b>: <i>go</i>, not <i>went</i>."},
{type:'build',cat:'Past simple · question',s:'Ask about a finished action.',h:'last weekend',t:'Write a question: they / visit / Dublin?',a:['did they visit dublin?'],r:"Use <b>Did + subject + base verb?</b> for past simple questions."},
{type:'build',cat:'Past continuous + past simple',s:'Describe an interrupted action.',h:'while / when',t:'Write a sentence: I / cook dinner / when the phone rang.',a:['i was cooking dinner when the phone rang.'],r:"Use <b>was/were + verb-ing</b> for the action in progress and past simple for the interrupting event."},
{type:'fix',cat:'Present perfect',s:'Correct the sentence.',h:'already',t:'I have saw that film already.',a:['i have seen that film already.'],r:"Use <b>have/has + past participle</b>: <i>seen</i>, not <i>saw</i>."},
{type:'build',cat:'Present perfect · question',s:'Ask about experience.',h:'ever',t:'Write a question: you / ever / visit Ireland?',a:['have you ever visited ireland?'],r:"Use <b>Have + subject + past participle?</b> for experience."},
{type:'build',cat:'Going to',s:'Describe a plan.',h:'this weekend',t:'Write a sentence: We / going to / meet our friends / this weekend.',a:["we are going to meet our friends this weekend."],r:"Use <b>am/is/are going to + base verb</b> for a plan."},
{type:'fix',cat:'Will · future',s:'Correct the sentence.',h:'I think',t:'She will studies tomorrow.',a:['she will study tomorrow.'],r:"After <b>will</b>, use the <b>base verb</b>: <i>study</i>."},
{type:'build',cat:'To be · past question',s:'Ask about a past situation.',h:'last night',t:'Write a question: they / at home / last night?',a:['were they at home last night?'],r:"Use <b>Were + subject...?</b> with <i>you/we/they</i> in the past."},
{type:'fix',cat:'Present continuous · negative',s:'Correct the sentence.',h:'at the moment',t:'He isn’t work at the moment.',a:["he isn't working at the moment.","he is not working at the moment."],r:"Use <b>isn't + verb-ing</b> for a negative present continuous sentence."}
];
let state=JSON.parse(localStorage.getItem('tenseSprint_v5')||'{"correct":0,"done":0,"weak":[]}');let q=[],i=0,mode='practice',timer;
const $=id=>document.getElementById(id);const norm=s=>s.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s+/g,' ').replace(/\bain't\b/g,'am not').replace(/\baren't\b/g,'are not').replace(/\bisn't\b/g,'is not').replace(/\bwasn't\b/g,'was not').replace(/\bweren't\b/g,'were not').replace(/\bdon't\b/g,'do not').replace(/\bdoesn't\b/g,'does not').replace(/\bdidn't\b/g,'did not').replace(/\bhaven't\b/g,'have not').replace(/\bhasn't\b/g,'has not').replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot');
function save(){localStorage.setItem('tenseSprint_v5',JSON.stringify(state))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function home(){clearInterval(timer);$('bar').style.width='0%';$('topInfo').textContent='A2 Exam Prep';$('screen').innerHTML=`<div class="hero"><div class="tag">Focused practice</div><h1>Make every answer count.</h1><p>Questions, negatives, tenses and an 80-word writing task — built for your exam tomorrow.</p></div><div class="stats"><div class="stat"><b>${state.correct}</b><small>correct</small></div><div class="stat"><b>${state.done}</b><small>attempts</small></div><div class="stat"><b>${state.weak.length}</b><small>to review</small></div></div><div class="menu"><button class="mode" onclick="start('practice')"><strong>Quick practice · 25 questions</strong><small>Immediate feedback. Skip and return later.</small></button><button class="mode" onclick="start('writing')"><strong>Write an 80-word story</strong><small>Guided planning with tense targets.</small></button><button class="mode" onclick="start('exam')"><strong>Exam mode · 30 minutes</strong><small>No hints or feedback until the end.</small></button></div><div class="tiny">Your progress is saved on this device.</div>`}
function start(m){mode=m;i=0;q=[];if(m==='writing')return writing();q=shuffle([...base,...base,...base]).slice(0,m==='exam'?18:25);if(m==='exam'){let end=Date.now()+1800000;timer=setInterval(()=>{let left=Math.max(0,end-Date.now());$('topInfo').textContent='Time: '+String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left/1000)%60).padStart(2,'0');if(!left){clearInterval(timer);finishExam()}},500)}render()}
function render(){let x=q[i];$('bar').style.width=(i/q.length*100)+'%';if(mode!=='exam')$('topInfo').textContent=`Question ${i+1} of ${q.length}`;$('screen').innerHTML=`<div class="card"><div class="tag">${x.cat}</div><div class="situation">${x.s}</div><div class="task">${x.t}</div><input id="answer" autocomplete="off" autocapitalize="sentences" placeholder="Type your answer in English"/><div class="actions"><button class="btn secondary" onclick="skip()">Skip for now</button><button class="btn primary" onclick="check()">Check answer</button></div><div id="feedback" class="feedback hide"></div></div><div class="tiny">Write the full sentence, including punctuation if you can.</div>`;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('answer').focus()}
function check(){let x=q[i],v=norm($('answer').value);if(!v)return;let ok=x.a.map(norm).includes(v);state.done++;if(ok)state.correct++;else state.weak.push(x);save();if(mode==='exam'){i++;return i<q.length?render():finishExam()}let f=$('feedback');f.className='feedback '+(ok?'correct':'wrong');f.innerHTML=ok?`<b>Correct — well done.</b><div>${x.r}</div>`:`<b>Not quite.</b><div><strong>Correct answer:</strong> ${x.a[0]}</div><div>${x.r}</div>`;$('answer').disabled=true;document.querySelector('.primary').textContent='Next question';document.querySelector('.primary').onclick=next}
function next(){i++;i<q.length?render():finish()}
function skip(){let x=q.splice(i,1)[0];q.splice(Math.min(i+4,q.length),0,x);render()}
function finish(){let rate=state.done?Math.round(state.correct/state.done*100):0;$('bar').style.width='100%';$('screen').innerHTML=`<div class="card"><div class="tag">Session complete</div><div class="hero"><h1>Keep the weak points close.</h1><p>Your overall accuracy is <b>${rate}%</b>. Review the items you missed or skipped before starting the writing task.</p></div><div class="checklist"><b>Final 5-minute check</b><br>• Do/does + base verb<br>• Did + base verb<br>• Was/were + verb-ing<br>• Have/has + past participle<br>• Will/going to + base verb</div><div class="actions"><button class="btn secondary" onclick="home()">Home</button><button class="btn primary" onclick="start('writing')">Write 80 words</button></div></div>`}
function finishExam(){clearInterval(timer);$('bar').style.width='100%';$('screen').innerHTML=`<div class="card"><div class="tag">Exam mode complete</div><div class="hero"><h1>Done.</h1><p>You completed the timed practice. Your answers have been added to your review record.</p></div><div class="actions"><button class="btn primary" onclick="home()">See my progress</button></div></div>`}
function writing(){clearInterval(timer);$('topInfo').textContent='Writing task';$('bar').style.width='15%';$('screen').innerHTML=`<div class="card"><div class="tag">80-word writing</div><div class="situation">Write about a busy day. Include your routine, something happening now, a past event, an interruption, an experience and a future plan.</div><div class="checklist">Aim to include:<br>• Present simple: routine<br>• Present continuous: now<br>• Past simple + past continuous: story<br>• Present perfect: experience/result<br>• Will or going to: future</div><textarea id="writing" placeholder="Write your paragraph here…" oninput="countWords()"></textarea><div class="words" id="wc">0 / 80 words</div><div class="actions"><button class="btn secondary" onclick="home()">Save and exit</button><button class="btn primary" onclick="reviewWriting()">Review checklist</button></div></div>`;let old=localStorage.getItem('tenseWriting_v5');if(old){$('writing').value=old;countWords()}}
function countWords(){let text=$('writing').value;localStorage.setItem('tenseWriting_v5',text);let n=text.trim()?text.trim().split(/\s+/).length:0;$('wc').textContent=n+' / 80 words'}
function reviewWriting(){let n=$('writing').value.trim()?$('writing').value.trim().split(/\s+/).length:0;$('bar').style.width='100%';$('screen').innerHTML=`<div class="card"><div class="tag">Self-review</div><div class="hero"><h1>${n} words written</h1><p>${n>=80?'You reached the target.':'Add '+(80-n)+' more words to reach 80.'}</p></div><div class="checklist"><b>Check before the exam</b><br>• Does every <i>he/she/it</i> present-simple verb have -s?<br>• After <i>do/does/did/will</i>, did you use the base verb?<br>• After <i>have/has</i>, did you use a past participle?<br>• Does each sentence have a clear time clue?</div><div class="actions"><button class="btn secondary" onclick="writing()">Edit paragraph</button><button class="btn primary" onclick="home()">Finish</button></div></div>`}
home();
</script></body></html>
